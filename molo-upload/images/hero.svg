<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#721517"/>
      <stop offset="40%" style="stop-color:#D12125"/>
      <stop offset="70%" style="stop-color:#F27B21"/>
      <stop offset="100%" style="stop-color:#721517"/>
    </linearGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="vignette" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="150" result="blur"/>
      <feComponentTransfer in="blur">
        <feFuncA type="table" tableValues="0 0.3"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#heroBg)"/>
  <rect width="1920" height="1080" filter="url(#noise)" opacity="0.15"/>
  <g opacity="0.25" transform="translate(960, 600) scale(3)">
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="#D12125" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="60" ry="35" fill="#F27B21" filter="url(#glow)"/>
    <ellipse cx="-20" cy="-10" rx="15" ry="10" fill="#FFFFFF" opacity="0.3"/>
    <ellipse cx="20" cy="-10" rx="15" ry="10" fill="#FFFFFF" opacity="0.3"/>
    <path d="M-30 20 Q0 40 30 20" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.2"/>
  </g>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>