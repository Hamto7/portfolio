<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Molo Broast - Fried Chicken Egypt | Concept Redesign Menu">
  <title>Molo Broast | Concept Redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syndicate+Rae:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
  <style>
    :root {
      --primary: #F27B21; /* Orange */
      --brand-red: #D12125; /* MOLO Red from logo */
      --hero-bg: #5A0B14; /* Dark burgundy / red wine hero background */
      --white: #FFFFFF;
      --dark-gray: #4A4A4A;
      --near-black: #0A0A0A;
      --near-black-2: #0F0F0F;
      --near-black-3: #141414;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--near-black);
      color: var(--white);
      overflow-x: hidden;
      line-height: 1.6;
    }

    body.ar {
      font-family: 'Cairo', 'Space Grotesk', sans-serif;
      direction: rtl;
    }

    body.ar h1, body.ar h2, body.ar h3, body.ar h4, body.ar .font-display {
      font-family: 'Syndicate Rae', 'Cairo', sans-serif;
    }

    /* Film grain overlay */
    .film-grain::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      animation: grain 0.3s steps(10) infinite;
    }

    @keyframes grain {
      0% { transform: translate(0, 0); }
      10% { transform: translate(-5%, -10%); }
      20% { transform: translate(-15%, 5%); }
      30% { transform: translate(7%, -25%); }
      40% { transform: translate(-5%, 25%); }
      50% { transform: translate(-15%, 10%); }
      60% { transform: translate(15%, 0%); }
      70% { transform: translate(0%, 15%); }
      80% { transform: translate(-10%, 10%); }
      90% { transform: translate(10%, -5%); }
      100% { transform: translate(0, 0); }
    }

    /* Vignette */
    .vignette::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      background: radial-gradient(ellipse at center, transparent 40%, var(--near-black) 100%);
      opacity: 0.6;
    }

    /* Warm glow */
    .warm-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120vw;
      height: 120vh;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(ellipse at center, rgba(242, 123, 33, 0.08) 0%, transparent 70%);
    }

    /* Font display class */
    .font-display {
      font-family: 'Syndicate Rae', 'Space Grotesk', sans-serif;
    }

    body.ar .font-display {
      font-family: 'Syndicate Rae', 'Cairo', sans-serif;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--near-black);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 2rem 1rem 4rem;
      background: var(--hero-bg);
      overflow: hidden;
    }

    .hero-bg-image {
      position: absolute;
      inset: 0;
      background-image: url('images/molo-background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      opacity: 0.4;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.1;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      z-index: 1;
    }

    /* Orange glow behind food */
    .hero-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vw;
      max-width: 800px;
      max-height: 800px;
      background: radial-gradient(circle, rgba(242, 123, 33, 0.3) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .hero-image-card {
      position: relative;
      width: clamp(350px, 70vw, 800px);
      z-index: 3;
      animation: float 5s ease-in-out infinite;
      margin-bottom: 2rem;
      background: var(--white);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 40px rgba(242, 123, 33, 0.15);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .hero-image {
      width: 100%;
      max-width: 800px;
      height: auto;
      aspect-ratio: 4/3;
      object-fit: contain;
      border-radius: 12px;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 1000px;
    }

    .hero-logo {
      width: clamp(120px, 20vw, 200px);
      height: auto;
      margin-bottom: 2rem;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
    }

    .hero-title {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-top: 1rem;
      text-transform: uppercase;
      font-family: 'Syndicate Rae', 'Space Grotesk', sans-serif;
    }

    .hero-title .white { color: var(--white); }
    .hero-title .orange { color: var(--primary); text-shadow: 0 0 30px rgba(242, 123, 33, 0.3); }

    .hero-subtitle {
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      margin-top: 1.5rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 3rem;
    }

    .hero-btn {
      padding: 1.25rem 2.5rem;
      border-radius: 50px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.4s ease;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .hero-btn.solid {
      background: var(--primary);
      color: #000;
      border: none;
      box-shadow: 0 10px 25px rgba(242, 123, 33, 0.3);
    }

    .hero-btn.solid:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(242, 123, 33, 0.5);
    }

    .hero-btn.outline {
      background: transparent;
      color: var(--white);
      border: 1.5px solid var(--white);
    }

    .hero-btn.outline:hover {
      background: var(--white);
      color: #000;
    }

    .hero-pill {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      background: var(--primary);
      color: #000;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
    }

    .hero-scroll-indicator {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      opacity: 0.6;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }

    .scroll-line {
      width: 1px;
      height: 60px;
      background: linear-gradient(180deg, var(--primary), transparent);
    }

    /* Language Toggle */
    .lang-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(242, 123, 33, 0.3);
      border-radius: 50px;
      padding: 0.5rem 0.5rem 0.5rem 1rem;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.ar .lang-toggle {
      right: auto;
      left: 1.5rem;
    }

    .lang-toggle:hover {
      border-color: var(--primary);
      box-shadow: 0 0 30px rgba(242, 123, 33, 0.2), inset 0 0 30px rgba(242, 123, 33, 0.05);
    }

    .lang-toggle .glow-ring {
      position: absolute;
      inset: -2px;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--primary), var(--orange));
      opacity: 0;
      filter: blur(8px);
      transition: opacity 0.4s ease;
      z-index: -1;
    }

    .lang-toggle:hover .glow-ring {
      opacity: 0.4;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.6);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.375rem 0.875rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    body.ar .lang-btn {
      font-family: 'Cairo', sans-serif;
    }

    .lang-btn.active {
      color: var(--white);
      background: linear-gradient(135deg, var(--primary), var(--primary));
      box-shadow: 0 4px 20px rgba(242, 123, 33, 0.4);
    }

    /* Floating Buttons */
    .floating-btns {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    body.ar .floating-btns {
      right: auto;
      left: 1.5rem;
    }

    .float-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-radius: 50px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    body.ar .float-btn {
      font-family: 'Cairo', sans-serif;
    }

    .float-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary), var(--orange));
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }

    .float-btn:hover::before {
      opacity: 1;
    }

    .float-btn .btn-glow {
      position: absolute;
      inset: -3px;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--primary), var(--orange));
      filter: blur(12px);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -2;
    }

    .float-btn:hover .btn-glow {
      opacity: 0.5;
    }

    .float-btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary));
      color: var(--white);
      box-shadow: 0 8px 30px rgba(242, 123, 33, 0.3);
    }

    .float-btn.primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 40px rgba(242, 123, 33, 0.5);
    }

    .float-btn.secondary {
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--white);
    }

    .float-btn.secondary:hover {
      border-color: var(--orange);
      transform: translateY(-3px) scale(1.02);
    }

    .float-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Sections */
    .section {
      padding: 6rem 1.5rem;
      position: relative;
      z-index: 5;
    }

    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .section-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 1rem;
      position: relative;
    }

    .section-tag::before,
    .section-tag::after {
      content: '';
      display: inline-block;
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      margin: 0 1rem;
      vertical-align: middle;
    }

    body.ar .section-tag::before,
    body.ar .section-tag::after {
      margin: 0 1rem;
    }

    .section-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--white) 0%, rgba(255,255,255,0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Category Tabs */
    .category-tabs {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      padding: 1.5rem 1rem;
      margin: 0 -1.5rem 3rem;
      background: linear-gradient(180deg, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0) 100%);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(242, 123, 33, 0.15);
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50px;
      color: rgba(255,255,255,0.6);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    body.ar .tab-btn {
      font-family: 'Cairo', sans-serif;
    }

    .tab-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: -1;
    }

    .tab-btn.active::before,
    .tab-btn:hover::before {
      transform: scaleX(1);
    }

    .tab-btn.active,
    .tab-btn:hover {
      color: var(--white);
      border-color: transparent;
    }

    .tab-btn.active {
      box-shadow: 0 4px 20px rgba(242, 123, 33, 0.3);
    }

    /* Menu Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      .menu-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .menu-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Menu Card */
    .menu-card {
      position: relative;
      background: linear-gradient(145deg, rgba(20,20,20,0.95) 0%, rgba(15,15,15,0.98) 100%);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .menu-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(210,33,37,0.15) 0%, rgba(242,123,33,0.1) 100%);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 0;
      pointer-events: none;
    }

    .menu-card:hover::before {
      opacity: 1;
    }

    .menu-card:hover {
      border-color: rgba(242, 123, 33, 0.4);
      box-shadow:
        0 30px 60px rgba(0,0,0,0.4),
        0 0 0 1px rgba(242, 123, 33, 0.2),
        inset 0 1px 0 rgba(255,255,255,0.03);
      transform: translateY(-8px);
    }

    .menu-card-image {
      aspect-ratio: 4/3;
      width: 100%;
      object-fit: contain;
      background: var(--white);
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .menu-card:hover .menu-card-image {
      transform: scale(1.08);
    }

    .menu-card-image-placeholder {
      aspect-ratio: 4/3;
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary) 50%, var(--orange) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .menu-card-image-placeholder::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.04' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/%3E%3C/svg%3E");
    }

    .menu-card-image-placeholder svg {
      width: 50%;
      opacity: 0.2;
      filter: drop-shadow(0 0 30px rgba(242, 123, 33, 0.4));
    }

    .menu-card-content {
      padding: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .menu-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .menu-card-name {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      flex: 1;
    }

    .menu-card-price {
      font-family: 'Syndicate Rae', 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--orange);
      white-space: nowrap;
      flex-shrink: 0;
    }

    body.ar .menu-card-price {
      font-family: 'Syndicate Rae', 'Cairo', sans-serif;
    }

    .menu-card-price-range {
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
    }

    .menu-card-desc {
      font-size: 0.875rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.55);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .spicy-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.75rem;
      background: linear-gradient(135deg, rgba(242, 123, 33, 0.2), rgba(242, 123, 33, 0.2));
      border: 1px solid rgba(242, 123, 33, 0.4);
      border-radius: 50px;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 0.75rem;
    }

    .spicy-badge svg {
      width: 12px;
      height: 12px;
    }

    .menu-card-note {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* Kids sub-items */
    .sub-items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .sub-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      background: rgba(242, 123, 33, 0.1);
      border: 1px solid rgba(242, 123, 33, 0.2);
      border-radius: 50px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.7);
    }

    .sub-item-price {
      color: var(--orange);
      font-weight: 700;
    }

    /* Section Note */
    .section-note {
      text-align: center;
      margin-top: 2rem;
      padding: 1.5rem;
      background: linear-gradient(135deg, rgba(210,33,37,0.08) 0%, rgba(242,123,33,0.05) 100%);
      border: 1px solid rgba(242, 123, 33, 0.2);
      border-radius: 16px;
      font-size: 0.9375rem;
      color: rgba(255,255,255,0.7);
    }

    .section-note strong {
      color: var(--orange);
    }

    /* Sauces grid - tighter */
    .sauces-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .sauce-card {
      background: linear-gradient(145deg, rgba(20,20,20,0.95) 0%, rgba(15,15,15,0.98) 100%);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 1.5rem 1rem;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sauce-card:hover {
      border-color: rgba(242, 123, 33, 0.4);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(242, 123, 33, 0.2);
      transform: translateY(-4px);
    }

    .sauce-name {
      font-size: 0.9375rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .sauce-price {
      font-family: 'Syndicate Rae', 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--orange);
    }

    body.ar .sauce-price {
      font-family: 'Syndicate Rae', 'Cairo', sans-serif;
    }

    /* Branches */
    .branches-section {
      padding: 6rem 1.5rem;
      background: var(--near-black-2);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .branches-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .branches-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1200px) {
      .branches-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .branch-card {
      background: linear-gradient(145deg, rgba(20,20,20,0.95) 0%, rgba(15,15,15,0.98) 100%);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 2rem;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .branch-card:hover {
      border-color: rgba(242, 123, 33, 0.3);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transform: translateY(-4px);
    }

    .branch-city {
      font-family: 'Syndicate Rae', 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--orange);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    body.ar .branch-city {
      font-family: 'Syndicate Rae', 'Cairo', sans-serif;
    }

    .branch-city::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary);
    }

    .branch-address {
      font-size: 0.9375rem;
      color: rgba(255,255,255,0.75);
      line-height: 1.6;
      direction: rtl;
      text-align: right;
    }

    .branch-info-card {
      background: linear-gradient(145deg, rgba(210,33,37,0.15) 0%, rgba(242,123,33,0.1) 100%);
      border-color: rgba(242, 123, 33, 0.3);
    }

    .branch-info-card .branch-city {
      color: var(--orange);
    }

    .branch-info-card .branch-address {
      color: rgba(255,255,255,0.85);
    }

    .branch-info-card .branch-address a {
      color: var(--orange);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .branch-info-card .branch-address a:hover {
      color: var(--white);
    }

    .branch-locations {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .branch-location {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      padding-left: 1.5rem;
      position: relative;
    }

    .branch-location::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--orange);
      font-weight: bold;
    }

    body.ar .branch-location {
      padding-left: 0;
      padding-right: 1.5rem;
    }

    body.ar .branch-location::before {
      left: auto;
      right: 0;
    }

    /* Footer */
    .footer {
      padding: 3rem 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: var(--near-black-2);
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }

    .footer-logo {
      width: 80px;
      height: auto;
      opacity: 0.5;
      filter: drop-shadow(0 0 20px rgba(242, 123, 33, 0.3));
    }

    .footer-disclaimer {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.8;
    }

    .footer-disclaimer strong {
      color: rgba(255,255,255,0.8);
    }

    .footer-vat {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.4);
    }

    /* Focus states for accessibility */
    .lang-btn:focus-visible,
    .tab-btn:focus-visible,
    .float-btn:focus-visible,
    .menu-card:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .hero-image,
      .menu-card-image,
      .menu-card {
        transition: none !important;
      }
      .hero-scroll-indicator {
        animation: none;
      }
    }

    /* High contrast mode adjustments */
    @media (prefers-contrast: high) {
      .menu-card {
        border-width: 2px;
      }
      .tab-btn {
        border-width: 2px;
      }
      .float-btn.secondary {
        border-width: 2px;
      }
    }
  </style>
</head>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

  <!-- Branches Section -->

  <!-- Footer -->

      <img class="footer-logo" src="images/logo.png" alt="Molo Broast" onerror="this.style.display='none';">

      <p class="footer-vat" id="footer-vat">All prices include VAT</p>
    </div>

  <script>
    // ============ DATA & STATE ============
    let menuData = null;
    let currentLang = 'en';
    let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ============ DOM ELEMENTS ============
    const heroSection = document.getElementById('hero');
    const menuMain = document.getElementById('menu-main');
    const heroImage = document.getElementById('hero-image');
    const heroPlaceholder = document.getElementById('hero-placeholder');
    const heroLogo = document.getElementById('hero-logo');

    // Text elements for i18n
    const heroTitle = document.getElementById('hero-title');
    const heroSubtitle = document.getElementById('hero-subtitle');
    const branchesTag = document.getElementById('branches-tag');
    const branchesTitle = document.getElementById('branches-title');
    const hotlineText = document.getElementById('hotline-text');
    const orderText = document.getElementById('order-text');
    const footerDisclaimer = document.getElementById('footer-disclaimer');
    const footerVat = document.getElementById('footer-vat');

    // Language buttons
    const langEnBtn = document.getElementById('lang-en');
    const langArBtn = document.getElementById('lang-ar');

    // ============ TRANSLATIONS ============
    const translations = {
      en: {
        heroTitle: 'Broast',
        heroSubtitle: 'Fried Chicken • Egypt',
        branchesTag: 'Our Branches',
        branchesTitle: 'Our Branches',
        hotlineText: 'Hotline 15243',
        orderText: 'Order Now',
        footerDisclaimer: 'Concept redesign, not affiliated with Molo',
        footerVat: 'All prices include VAT',
        sandwiches: 'SANDWICHES',
        spicy: 'Spicy',
        ro: 'RO',
        l: 'L',
        egp: 'EGP',
        kids: 'Kids',
        and: 'and',
        includes: 'includes',
        chooseSauce: 'Choose a sauce:',
        each: 'each',
        hotline: 'Hotline',
        vat: 'Prices include VAT'
      },
      ar: {
        heroTitle: 'بروست',
        heroSubtitle: 'فرايد تشيكن • مصر',
        branchesTag: 'فروعنا',
        branchesTitle: 'فروعنا',
        hotlineText: 'الخط الساخن 15243',
        orderText: 'اطلب الآن',
        footerDisclaimer: 'إعادة تصميم مفاهيمية، غير تابعة لـ مولو',
        footerVat: 'الأسعار تشمل ضريبة القيمة المضافة',
        sandwiches: 'ساندوتشات',
        spicy: 'حار',
        ro: 'صغير',
        l: 'كبير',
        egp: 'ج.م',
        kids: 'أطفال',
        and: 'و',
        includes: 'تشمل',
        chooseSauce: 'اختر صوص:',
        each: 'لكل',
        hotline: 'الخط الساخن',
        vat: 'الأسعار تشمل ضريبة القيمة المضافة'
      }
    };

    // ============ UTILITIES ============
    function formatPrice(price) {
      const t = translations[currentLang];
      return `${price} ${t.egp}`;
    }

    function createSpicyBadge() {
      const t = translations[currentLang];
      return `
        <span class="spicy-badge" aria-label="${t.spicy}">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.21c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
          ${t.spicy}
        </span>
      `;
    }

    function getItemImage(itemData) {
      // Read image path from item's image field in menu.json
      // The image field contains the full file name like "juice.jpg"
      const imgField = itemData.image || `${itemData.id}.jpg`;

      // Clean path if it contains 'images/' prefix already
      const filename = imgField.replace('images/', '');

      // Return path: images/filename.jpg?v=3
      return `images/${filename}?v=3`;
    }

    function createImageElement(itemData, className, alt) {
      const img = document.createElement('img');
      img.src = getItemImage(itemData);
      img.alt = alt;
      img.className = className;
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        const placeholder = this.nextElementSibling;
        if (placeholder && placeholder.classList.contains('image-placeholder')) {
          placeholder.style.display = 'flex';
        }
      };
      return img;
    }

    function createImagePlaceholder(className) {
      const div = document.createElement('div');
      div.className = `${className} image-placeholder`;
      div.style.display = 'none';
      div.innerHTML = `
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="100" cy="100" r="85" stroke="currentColor" stroke-width="1.5" stroke-dasharray="25 12" opacity="0.25"/>
          <ellipse cx="100" cy="125" rx="30" ry="18" fill="currentColor" opacity="0.12"/>
          <ellipse cx="100" cy="125" rx="20" ry="10" fill="currentColor" opacity="0.2"/>
        </svg>
      `;
      return div;
    }

    // ============ RENDER FUNCTIONS ============
    function renderAllCategories() {
      if (!menuData || !menuData.categories) return;

      const categorySections = ['sandwiches', 'solo-meals', 'family-meals', 'sides', 'adds', 'sauces', 'drinks'];
      const tabCategories = ['sandwiches']; // Only sandwiches gets tabs for now

      // Clear menu main
      menuMain.innerHTML = '';

      categorySections.forEach((catId, index) => {
        const category = menuData.categories.find(c => c.id === catId);
        if (!category) return;

        const section = document.createElement('section');
        section.className = 'section';
        section.id = catId;
        section.setAttribute('aria-labelledby', `${catId}-title`);

        let sectionHtml = '';

        // Add category tabs for sandwiches
        if (tabCategories.includes(catId)) {
          sectionHtml += `<div class="category-tabs" id="${catId}-tabs" role="tablist" aria-label="${category.name} categories"></div>`;
        }

        // Section header (for non-sandwiches)
        if (!tabCategories.includes(catId)) {
          const t = translations[currentLang];
          const tagText = category.name_ar && currentLang === 'ar' ? category.name_ar : category.name;
          sectionHtml += `
            <div class="section-header">
              <div class="section-tag" id="${catId}-tag">${tagText}</div>
              <h2 class="section-title font-display" id="${catId}-title">${tagText}</h2>
            </div>
          `;
        }

        // Section note if exists
        if (category.note || category.note_ar) {
          const noteText = currentLang === 'ar' && category.note_ar ? category.note_ar : category.note;
          sectionHtml += `<div class="section-note" id="${catId}-note">${noteText}</div>`;
        }

        // Grid
        const gridClass = catId === 'sauces' ? 'sauces-grid' : 'menu-grid';
        sectionHtml += `<div class="${gridClass}" id="${catId}-grid" role="tabpanel"></div>`;

        section.innerHTML = sectionHtml;
        menuMain.appendChild(section);

        // Render items
        if (catId === 'sauces') {
          renderSauces(category);
        } else {
          renderCategoryItems(category, catId);
        }

        // Render tabs for sandwiches
        if (tabCategories.includes(catId)) {
          renderCategoryTabs(category);
        }
      });

      // Initialize tilt effects
      initCardTilt();

      // Refresh ScrollTrigger
      ScrollTrigger.refresh();
    }

    function renderCategoryTabs(category) {
      const t = translations[currentLang];
      const tabsContainer = document.getElementById(`${category.id}-tabs`);
      if (!tabsContainer) return;

      const tagText = category.name_ar && currentLang === 'ar' ? category.name_ar : category.name;
      tabsContainer.innerHTML = `
        <button class="tab-btn active" data-tab="all" role="tab" aria-selected="true" aria-controls="${category.id}-grid">${tagText}</button>
      `;
    }

    function renderCategoryItems(category, catId) {
      const grid = document.getElementById(`${catId}-grid`);
      if (!grid) return;

      const t = translations[currentLang];
      grid.innerHTML = category.items.map(item => {
        const hasSizes = item.price_ro !== undefined && item.price_l !== undefined;
        const priceHtml = hasSizes
          ? `<span class="menu-card-price">${item.price_ro} ${t.ro} / ${item.price_l} ${t.l}</span>`
          : `<span class="menu-card-price">${formatPrice(item.price)}</span>`;

        const desc = currentLang === 'ar' ? item.description_ar : '';
        const spicyBadge = item.spicy ? createSpicyBadge() : '';
        const noteHtml = item.note || item.note_ar ? `
          <p class="menu-card-note" dir="${currentLang === 'ar' ? 'rtl' : 'ltr'}">
            ${currentLang === 'ar' && item.note_ar ? item.note_ar : item.note}
          </p>
        ` : '';

        const subItemsHtml = item.sub_items ? `
          <div class="sub-items">
            ${item.sub_items.map(sub => `
              <span class="sub-item">
                ${sub.name}
                <span class="sub-item-price">${formatPrice(sub.price)}</span>
              </span>
            `).join('')}
          </div>
        ` : '';

        return `
          <article class="menu-card" tabindex="0" role="button" aria-label="${item.name}${item.spicy ? ', ' + t.spicy : ''}${hasSizes ? `, ${item.price_ro} to ${item.price_l} ${t.egp}` : `, ${item.price} ${t.egp}`}">
            ${createImageElement(item, 'menu-card-image', item.name).outerHTML}
            <div class="menu-card-content">
              ${spicyBadge}
              <div class="menu-card-header">
                <h3 class="menu-card-name">${item.name}</h3>
                ${priceHtml}
              </div>
              ${desc ? `<p class="menu-card-desc" dir="${currentLang === 'ar' ? 'rtl' : 'ltr'}">${desc}</p>` : ''}
              ${noteHtml}
              ${subItemsHtml}
            </div>
          </article>
        `;
      }).join('');
    }

    function renderSauces(category) {
      const grid = document.getElementById('sauces-grid');
      if (!grid) return;

      const t = translations[currentLang];
      const noteText = currentLang === 'ar' && category.note_ar ? category.note_ar : category.note;
      const noteEl = document.getElementById('sauces-note');
      if (noteEl && noteText) {
        noteEl.innerHTML = noteText;
      }

      grid.innerHTML = category.items.map(item => {
        const desc = currentLang === 'ar' ? item.description_ar : '';
        return `
          <article class="sauce-card" tabindex="0" role="button" aria-label="${item.name}, ${formatPrice(item.price)}">
            <h3 class="sauce-name">${item.name}</h3>
            <div class="sauce-price">${formatPrice(item.price)}</div>
          </article>
        `;
      }).join('');
    }

    function renderBranches() {
      const grid = document.getElementById('branches-grid');
      if (!grid) {
        console.error('branches-grid element not found');
        return;
      }
      if (!menuData || !menuData.branches) {
        console.error('menuData.branches not available');
        grid.innerHTML = '<p style="color: red; padding: 1rem;">Branches data not loaded</p>';
        return;
      }

      const t = translations[currentLang];
      const hotline = menuData.hotline || '15243';
      const vatNote = currentLang === 'ar' ? 'الأسعار تشمل ضريبة القيمة المضافة' : 'All prices include VAT';

      const branchesHTML = menuData.branches.map(branch => {
        const name = currentLang === 'ar' ? branch.name_ar : branch.name_en;
        const address = currentLang === 'ar' ? branch.address_ar : branch.address_en;
        if (!name || !address) {
          console.warn('Branch missing en/ar fields:', branch);
        }
        return `
          <article class="branch-card">
            <h3 class="branch-city">${name || ''}</h3>
            <p class="branch-address">${address || ''}</p>
          </article>
        `;
      }).join('');

      // Add hotline and VAT note at the end of branches grid
      const hotlineCard = `
        <article class="branch-card branch-info-card">
          <h3 class="branch-city">${t.hotline || 'Hotline'}</h3>
          <p class="branch-address"><a href="tel:${hotline}" style="color: var(--primary); text-decoration: none;">${hotline}</a></p>
        </article>
      `;
      const vatCard = `
        <article class="branch-card branch-info-card">
          <h3 class="branch-city">${t.vat || 'Prices include VAT'}</h3>
          <p class="branch-address">${vatNote}</p>
        </article>
      `;
      grid.innerHTML = branchesHTML + hotlineCard + vatCard;
    }

    // ============ CARD TILT EFFECT ============
    function initCardTilt() {
      if (prefersReducedMotion) return;

      const cards = document.querySelectorAll('.menu-card');

      cards.forEach(card => {
        card._tiltHandler = card._tiltHandler || handleTilt;
        card._tiltLeaveHandler = card._tiltLeaveHandler || handleTiltLeave;
        card.removeEventListener('mousemove', card._tiltHandler);
        card.removeEventListener('mouseleave', card._tiltLeaveHandler);
        card.addEventListener('mousemove', card._tiltHandler);
        card.addEventListener('mouseleave', card._tiltLeaveHandler);
      });
    }

    function handleTilt(e) {
      const card = e.currentTarget;
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -8;
      const rotateY = ((x - centerX) / centerX) * 8;

      gsap.to(card, {
        rotationX: rotateX,
        rotationY: rotateY,
        transformPerspective: 1000,
        transformOrigin: 'center center',
        duration: 0.4,
        ease: 'power2.out'
      });

      const shineX = (x / rect.width) * 100;
      const shineY = (y / rect.height) * 100;
      card.style.setProperty('--shine-x', `${shineX}%`);
      card.style.setProperty('--shine-y', `${shineY}%`);
    }

    function handleTiltLeave(e) {
      const card = e.currentTarget;
      gsap.to(card, {
        rotationX: 0,
        rotationY: 0,
        duration: 0.6,
        ease: 'elastic.out(1, 0.5)'
      });
    }

    // ============ LANGUAGE TOGGLE ============
    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.body.classList.toggle('ar', lang === 'ar');

      // Update active button
      langEnBtn.classList.toggle('active', lang === 'en');
      langArBtn.classList.toggle('active', lang === 'ar');
      langEnBtn.setAttribute('aria-pressed', lang === 'en');
      langArBtn.setAttribute('aria-pressed', lang === 'ar');

      // Animate toggle
      if (!prefersReducedMotion) {
        gsap.fromTo([langEnBtn, langArBtn],
          { scale: 0.9, opacity: 0.5 },
          { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)', stagger: 0.05 }
        );
      }

      // Update all text
      updateTextContent();
      renderAllCategories();
      renderBranches();

      // Refresh ScrollTrigger
      ScrollTrigger.refresh();
    }

    function updateTextContent() {
      const t = translations[currentLang];

      if (heroTitle) heroTitle.textContent = t.heroTitle;
      if (heroSubtitle) heroSubtitle.textContent = t.heroSubtitle;
      if (branchesTag) branchesTag.textContent = t.branchesTag;
      if (branchesTitle) branchesTitle.textContent = t.branchesTitle;
      if (hotlineText) hotlineText.textContent = t.hotlineText;
      if (orderText) orderText.textContent = t.orderText;
      if (footerDisclaimer) footerDisclaimer.textContent = t.footerDisclaimer;
      if (footerVat) footerVat.textContent = t.footerVat === 'All prices include VAT' || t.footerVat === 'الأسعار تشمل ضريبة القيمة المضافة' ? (currentLang === 'ar' ? 'الأسعار تشمل ضريبة القيمة المضافة' : 'All prices include VAT') : t.footerVat;
    }

    langEnBtn.addEventListener('click', () => setLanguage('en'));
    langArBtn.addEventListener('click', () => setLanguage('ar'));

    // ============ HERO IMAGE LOADING ============
    function handleHeroImage() {
      const img = new Image();
      img.src = 'images/hero.jpg';
      img.onload = () => {
        heroImage.style.display = 'block';
        heroPlaceholder.style.display = 'none';
        initHeroAnimation();
      };
      img.onerror = () => {
        heroImage.style.display = 'none';
        heroPlaceholder.style.display = 'flex';
        initHeroAnimation();
      };
    }

    // ============ GSAP ANIMATIONS ============
    function initHeroAnimation() {
      if (prefersReducedMotion) {
        gsap.set('.hero-content > *', { opacity: 1, y: 0 });
        gsap.set('#menu-main', { display: 'block' });
        initScrollAnimations();
        return;
      }

      gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);

      // Get new hero elements
      const heroTitle = document.getElementById('hero-title');
      const heroPill = document.querySelector('.hero-pill');
      const heroBtns = document.querySelector('.hero-btns');
      const heroImageCard = document.querySelector('.hero-image-card');

      // Hero intro timeline
      const heroTl = gsap.timeline({
        onComplete: () => {
          menuMain.style.display = 'block';
          initScrollAnimations();
        }
      });

      heroTl
        .fromTo(heroLogo,
          { opacity: 0, scale: 0.8, filter: 'drop-shadow(0 0 0px rgba(242, 123, 33, 0))' },
          { opacity: 1, scale: 1, filter: 'drop-shadow(0 0 40px rgba(242, 123, 33, 0.6))', duration: 1.2, ease: 'power3.out' }
        )
        .fromTo(heroTitle,
          { opacity: 0, y: 60, clipPath: 'inset(100% 0 0 0)' },
          { opacity: 1, y: 0, clipPath: 'inset(0% 0 0 0)', duration: 1, ease: 'power3.out' }, '-=0.6'
        )
        .fromTo(heroPill,
          { opacity: 0, y: 20, scale: 0.8 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: 'power2.out' }, '-=0.5'
        )
        .fromTo(heroBtns,
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, '-=0.4'
        );

      // Hero image card parallax float (subtle)
      gsap.to(heroImageCard, {
        yPercent: 5,
        ease: 'none',
        scrollTrigger: {
          trigger: heroSection,
          start: 'top top',
          end: 'bottom top',
          scrub: 1
        }
      });

      // Hero content parallax
      gsap.to('.hero-content', {
        yPercent: 20,
        ease: 'none',
        scrollTrigger: {
          trigger: heroSection,
          start: 'top top',
          end: 'bottom top',
          scrub: 1
        }
      });

      // Hero opacity fade
      gsap.to(heroSection, {
        opacity: 0,
        ease: 'none',
        scrollTrigger: {
          trigger: heroSection,
          start: 'bottom top',
          end: 'bottom bottom',
          scrub: 1,
          onUpdate: self => {
            if (self.progress > 0.8) {
              menuMain.style.display = 'block';
            }
          }
        }
      });
    }

    function initScrollAnimations() {
      if (prefersReducedMotion) {
        gsap.set('.section-header, .menu-card, .category-tabs, .section-note, .sauce-card, .branch-card', { opacity: 1, y: 0 });
        return;
      }

      // Section headers stagger reveal
      gsap.utils.toArray('.section-header').forEach(header => {
        gsap.fromTo(header.querySelectorAll('.section-tag, .section-title'),
          { opacity: 0, y: 40 },
          {
            opacity: 1,
            y: 0,
            duration: 0.8,
            ease: 'power3.out',
            stagger: 0.15,
            scrollTrigger: {
              trigger: header,
              start: 'top 80%',
              toggleActions: 'play none none reverse'
            }
          }
        );
      });

      // Category tabs
      gsap.fromTo('.category-tabs',
        { opacity: 0, y: 20 },
        {
          opacity: 1,
          y: 0,
          duration: 0.6,
          ease: 'power2.out',
          scrollTrigger: {
            trigger: '#sandwiches',
            start: 'top 75%',
            toggleActions: 'play none none reverse'
          }
        }
      );

      // Menu cards stagger
      gsap.utils.toArray('.menu-grid').forEach(grid => {
        const cards = grid.querySelectorAll('.menu-card');
        gsap.fromTo(cards,
          { opacity: 0, y: 50, scale: 0.95 },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            duration: 0.7,
            ease: 'power3.out',
            stagger: 0.08,
            scrollTrigger: {
              trigger: grid,
              start: 'top 80%',
              toggleActions: 'play none none reverse'
            }
          }
        );
      });

      // Sauces cards
      gsap.fromTo('.sauces-grid .sauce-card',
        { opacity: 0, y: 40, scale: 0.95 },
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.5,
          ease: 'power3.out',
          stagger: 0.05,
          scrollTrigger: {
            trigger: '.sauces-grid',
            start: 'top 80%',
            toggleActions: 'play none none reverse'
          }
        }
      );

      // Section notes
      gsap.fromTo('.section-note',
        { opacity: 0, y: 30, scale: 0.98 },
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.6,
          ease: 'power2.out',
          scrollTrigger: {
            trigger: '.section-note',
            start: 'top 85%',
            toggleActions: 'play none none reverse'
          }
        }
      );

      // Branch cards
      gsap.fromTo('.branch-card',
        { opacity: 0, y: 40, scale: 0.98 },
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.6,
          ease: 'power3.out',
          stagger: 0.1,
          scrollTrigger: {
            trigger: '#branches-grid',
            start: 'top 80%',
            toggleActions: 'play none none reverse'
          }
        }
      );

      // Floating buttons entrance
      gsap.fromTo('.floating-btns .float-btn',
        { opacity: 0, y: 30, scale: 0.9 },
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.6,
          ease: 'back.out(1.5)',
          stagger: 0.1,
          delay: 0.5,
          scrollTrigger: {
            trigger: 'footer',
            start: 'top 90%',
            toggleActions: 'play none none reverse'
          }
        }
      );

      // Tab highlight on scroll
      initTabScrollHighlight();
    }

    function initTabScrollHighlight() {
      const sections = ['#sandwiches', '#solo-meals', '#family-meals', '#sides', '#adds', '#sauces', '#drinks'];
      const tabBtns = document.querySelectorAll('.tab-btn[data-tab]');

      sections.forEach((selector, index) => {
        const section = document.querySelector(selector);
        if (!section) return;

        ScrollTrigger.create({
          trigger: section,
          start: 'top center',
          end: 'bottom center',
          onEnter: () => setActiveTab(index),
          onEnterBack: () => setActiveTab(index),
        });
      });
    }

    function setActiveTab(index) {
      const tabBtns = document.querySelectorAll('.tab-btn[data-tab]');
      tabBtns.forEach((btn, i) => {
        const isActive = i === index;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive);
        if (!prefersReducedMotion && isActive) {
          gsap.fromTo(btn,
            { scale: 0.95, boxShadow: '0 0 0 rgba(242, 123, 33, 0)' },
            { scale: 1, boxShadow: '0 4px 20px rgba(242, 123, 33, 0.3)', duration: 0.3, ease: 'power2.out' }
          );
        }
      });
    }

    // ============ ORDER BUTTON ============
    document.getElementById('order-btn').addEventListener('click', () => {
      const sandwiches = document.getElementById('sandwiches');
      if (sandwiches) {
        gsap.to(window, {
          duration: 1.2,
          scrollTo: { y: sandwiches, offsetY: 80 },
          ease: 'power3.inOut'
        });
      }

      if (!prefersReducedMotion) {
        gsap.to('#order-btn', {
          scale: [1, 0.95, 1],
          boxShadow: ['0 8px 30px rgba(242, 123, 33, 0.3)', '0 15px 40px rgba(242, 123, 33, 0.6)', '0 8px 30px rgba(242, 123, 33, 0.3)'],
          duration: 0.4,
          ease: 'power2.inOut'
        });
      }
    });

    // ============ INITIALIZATION ============
    async function init() {
      try {
        const response = await fetch('menu.json?v=3');
        if (!response.ok) throw new Error('Failed to load menu data');
        menuData = await response.json();

        // Check for saved language preference
        const savedLang = localStorage.getItem('molo-lang');
        if (savedLang && (savedLang === 'en' || savedLang === 'ar')) {
          setLanguage(savedLang);
        } else {
          const browserLang = navigator.language || navigator.userLanguage;
          if (browserLang.startsWith('ar')) {
            setLanguage('ar');
          } else {
            setLanguage('en');
          }
        }

        // Save language preference
        const originalSetLanguage = setLanguage;
        window.setLanguage = function(lang) {
          originalSetLanguage(lang);
          localStorage.setItem('molo-lang', lang);
        };

        langEnBtn.onclick = () => window.setLanguage('en');
        langArBtn.onclick = () => window.setLanguage('ar');

        handleHeroImage();
      // Ensure branches render after init
      if (menuData && menuData.branches) {
        renderBranches();
      }
      } catch (error) {
        console.error('Failed to initialize menu:', error);
        heroSection.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;">
            <h1 style="font-family:'Syndicate Rae',sans-serif;font-size:clamp(2rem,5vw,4rem);color:var(--primary);margin-bottom:1rem;">Error</h1>
            <p style="color:rgba(255,255,255,0.6);max-width:600px;">${error.message || String(error)}</p>
            <pre style="color:rgba(255,255,255,0.4);max-width:600px;text-align:left;padding:1rem;background:rgba(0,0,0,0.3);border-radius:8px;overflow:auto;">${error.stack || 'No stack trace'}</pre>
          </div>
        `;
      }
    }

    // Start initialization
    init();

    // Ensure branches render after everything is loaded
    setTimeout(() => {
      if (menuData && menuData.branches) {
        renderBranches();
      }
    }, 200);

    // Handle logo error
    heroLogo.onerror = function() {
      this.style.display = 'none';
      document.getElementById('logo-fallback').style.display = 'block';
    };
  </script>
</body>
</html>
